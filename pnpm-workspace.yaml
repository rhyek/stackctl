packages:
  - 'packages/*'
  - 'synced-utils/*'
# The git hooks are set up by our own `prepare` script, so simple-git-hooks' own
# postinstall build script is not needed (pnpm's approve-builds gate).
allowBuilds:
  simple-git-hooks: false
  # VitePress's esbuild gets its binary from its platform package; its postinstall only checks it.
  esbuild: false
# Track the latest release of every dependency (disable pnpm's release-age gate).
minimumReleaseAge: 0
# Don't install a package's peer dependencies for it; the workspace declares the ones it uses.
autoInstallPeers: false
